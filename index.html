<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACS Student Chapter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        /* ================= BACKGROUND ================= */

        body::before {
            content: "";
            position: fixed;
            inset: -20px;
            background-image: url("back.jpeg");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            filter: blur(15px);
            transform: scale(1.06);
            opacity: 0.20;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.72);
            z-index: -1;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            margin: auto;
            padding: 45px 22px 30px;
            text-align: center;
        }

        /* ================= LOGO ================= */

        .hero-image {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            margin-bottom: 22px;
        }

        /* ================= TITLE ================= */

        h1 {
            font-size: 28px;
            color: #123b68;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 15px;
            color: #555;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* ================= PAGES ================= */

        #socialPage {
            display: none;
        }

        /* ================= BUTTONS ================= */

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            min-height: 60px;
            border: none;
            border-radius: 16px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.15);
            transition: all 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 11px 24px rgba(0, 0, 0, 0.20);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Register */

        .register-btn {
            background: linear-gradient(135deg, #123b68, #1d5d94);
        }

        .register-btn:hover {
            background: linear-gradient(135deg, #0e3156, #174d7d);
        }

        /* Social Media */

        .social-main-btn {
            background: linear-gradient(135deg, #333333, #555555);
        }

        .social-main-btn:hover {
            background: linear-gradient(135deg, #222222, #444444);
        }

        /* ================= SOCIAL BUTTONS ================= */

        .social-btn {
            min-height: 58px;
        }

        /* Facebook */

        .facebook {
            background: linear-gradient(135deg, #1877F2, #145DB2);
        }

        .facebook:hover {
            background: linear-gradient(135deg, #1268D8, #104F99);
        }

        /* Instagram */

        .instagram {
            background: linear-gradient(
                135deg,
                #833AB4,
                #C13584,
                #E1306C,
                #F77737
            );
        }

        .instagram:hover {
            filter: brightness(0.92);
        }

        /* TikTok */

        .tiktok {
            background: linear-gradient(135deg, #111111, #292929);
        }

        .tiktok:hover {
            background: linear-gradient(135deg, #000000, #1c1c1c);
        }

        /* LinkedIn */

        .linkedin {
            background: linear-gradient(135deg, #0A4F7A, #0B6FA4);
        }

        .linkedin:hover {
            background: linear-gradient(135deg, #083E61, #095B87);
        }

        /* Back */

        .back-btn {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.92);
            color: #123b68;
            border: 2px solid #123b68;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);
        }

        .back-btn:hover {
            background: #123b68;
            color: white;
        }

        /* ================= ICON ================= */

        .icon {
            font-size: 22px;
        }

        /* ================= FOOTER ================= */

        footer {
            margin-top: 40px;
            color: #666;
            font-size: 13px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 480px) {

            .container {
                padding: 35px 18px 25px;
            }

            .hero-image {
                width: 155px;
                height: 155px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
                margin-bottom: 27px;
            }

            .btn {
                min-height: 57px;
                font-size: 16px;
            }
        }

        @media (max-width: 360px) {

            .hero-image {
                width: 140px;
                height: 140px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ================= HOME PAGE ================= -->

        <section id="homePage">

            <img src="acs.jpg" alt="ACS Student Chapter" class="hero-image">

            <h1>ACS Student Chapter</h1>

            <p class="subtitle">
                Ain Shams University Student Chapter
            </p>

            <div class="buttons">

                <a
                    href="https://tally.so/r/xXqXBG"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn register-btn"
                >
                    <span class="icon">📝</span>
                    Register
                </a>

                <button
                    class="btn social-main-btn"
                    onclick="showSocialPage()"
                >
                    <span class="icon">🌐</span>
                    Social Media
                </button>

            </div>

        </section>


        <!-- ================= SOCIAL MEDIA PAGE ================= -->

        <section id="socialPage">

            <img src="acs.jpg" alt="ACS Student Chapter" class="hero-image">

            <h1>Social Media</h1>

            <p class="subtitle">
                Follow ACS Ain Shams University Student Chapter
            </p>

            <div class="buttons">

                <!-- Facebook -->

                <a
                    href="https://www.facebook.com/share/1WGXzNVfxr/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn social-btn facebook"
                >
                    <span class="icon">📘</span>
                    Facebook
                </a>


                <!-- Instagram -->

                <a
                    href="https://www.instagram.com/acs672019?igsi=MTZyYjF4eHJ0ZjRpYQ=="
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn social-btn instagram"
                >
                    <span class="icon">📸</span>
                    Instagram
                </a>


                <!-- TikTok -->

                <a
                    href="https://www.tiktok.com/@acs0775?_r=1&_t=ZS-99SIyQQvjaH"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn social-btn tiktok"
                >
                    <span class="icon">🎵</span>
                    TikTok
                </a>


                <!-- LinkedIn -->

                <a
                    href="https://www.linkedin.com/company/acschapter/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn social-btn linkedin"
                >
                    <span class="icon">💼</span>
                    LinkedIn
                </a>


                <!-- Back -->

                <button
                    class="btn back-btn"
                    onclick="showHomePage()"
                >
                    ← Back
                </button>

            </div>

        </section>


        <!-- ================= FOOTER ================= -->

        <footer>
            © 2026 ACS Student Chapter
        </footer>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function showSocialPage() {

            document.getElementById("homePage").style.display = "none";
            document.getElementById("socialPage").style.display = "block";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        function showHomePage() {

            document.getElementById("socialPage").style.display = "none";
            document.getElementById("homePage").style.display = "block";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

    </script>

</body>
</html>
