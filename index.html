<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACS Student Chapter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* ================= BACKGROUND ================= */

        body::before {
            content: "";
            position: fixed;
            inset: -20px;
            background-image: url("back.png");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            filter: blur(5px);
            transform: scale(1.06);
            opacity: 1;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.08);
            z-index: -1;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 45px 22px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* ================= LOGO ================= */

        .logo {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid white;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            margin-bottom: 25px;
        }

        /* ================= TITLE ================= */

        .title {
            font-size: 30px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 16px;
            color: #374151;
            margin-bottom: 35px;
        }

        /* ================= BUTTONS ================= */

        .buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            width: 100%;
            padding: 17px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            border: none;
            transition: all 0.25s ease;
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.18);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
        }

        .social-btn {
            background: #111827;
        }

        .social-btn:hover {
            background: #1f2937;
        }

        /* ================= SOCIAL DROPDOWN ================= */

        .social-dropdown {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: -6px;
            animation: slideDown 0.3s ease;
        }

        .social-dropdown.show {
            display: flex;
        }

        .social-item {
            width: 100%;
            padding: 13px 18px;
            border-radius: 12px;
            text-decoration: none;
            color: #1f2937;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.25s ease;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .social-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);
        }

        /* Soft Colors */

        .facebook {
            background: #dce9f7;
        }

        .facebook:hover {
            background: #cbdff3;
        }

        .instagram {
            background: #f0dfe8;
        }

        .instagram:hover {
            background: #ead1df;
        }

        .tiktok {
            background: #e1e3e6;
        }

        .tiktok:hover {
            background: #d5d8dc;
        }

        .linkedin {
            background: #dcebf3;
        }

        .linkedin:hover {
            background: #cce3ee;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================= FOOTER ================= */

        .footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 13px;
            color: #374151;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 480px) {

            .container {
                padding: 35px 18px 25px;
            }

            .logo {
                width: 160px;
                height: 160px;
            }

            .title {
                font-size: 26px;
            }

            .subtitle {
                font-size: 15px;
            }

            .btn,
            .social-item {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ================= HOME PAGE ================= -->

        <div id="homePage">

            <img src="acs.jpg" alt="ACS Student Chapter Logo" class="logo">

            <h1 class="title">
                ACS Student Chapter
            </h1>

            <p class="subtitle">
                Ain Shams University Student Chapter
            </p>

            <div class="buttons">

                <a
                    href="https://tally.so/r/xXqXBG"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn social-btn">
                    Registration Form
                </a>

                <button class="btn social-btn" onclick="toggleSocialMedia()">
                    Social Media
                </button>

                <!-- SOCIAL MEDIA DROPDOWN -->

                <div id="socialDropdown" class="social-dropdown">

                    <a
                        href="https://www.facebook.com/share/1WGXzNVfxr/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-item facebook">
                        Facebook
                    </a>

                    <a
                        href="https://www.instagram.com/acs672019?igsi=MTZyYjF4eHJ0ZjRpYQ=="
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-item instagram">
                        Instagram
                    </a>

                    <a
                        href="https://www.tiktok.com/@acs0775?_r=1&_t=ZS-99SIyQQvjaH"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-item tiktok">
                        TikTok
                    </a>

                    <a
                        href="https://www.linkedin.com/company/acschapter/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-item linkedin">
                        LinkedIn
                    </a>

                </div>

            </div>

        </div>

        <!-- ================= FOOTER ================= -->

        <div class="footer">
            © 2026 ACS Student Chapter
        </div>

    </div>

    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function toggleSocialMedia() {

            const socialDropdown =
                document.getElementById("socialDropdown");

            socialDropdown.classList.toggle("show");

        }

    </script>

</body>
</html>
