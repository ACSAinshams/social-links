<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACS Student Chapter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* ================= BACKGROUND ================= */

        body::before {
            content: "";
            position: fixed;
            inset: -20px;
            background-image: url("back.png");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            filter: blur(5px);
            transform: scale(1.06);
            opacity: 1;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.08);
            z-index: -1;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 45px 22px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* ================= LOGO ================= */

        .logo {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid white;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            margin-bottom: 25px;
        }

        /* ================= TITLE ================= */

        .title {
            font-size: 30px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 16px;
            color: #374151;
            margin-bottom: 35px;
        }

        /* ================= BUTTONS ================= */

        .buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            width: 100%;
            padding: 17px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            border: none;
            transition: all 0.25s ease;
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.18);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
        }

        .social-btn {
            background: #111827;
        }

        .social-btn:hover {
            background: #1f2937;
        }

        /* ================= SOCIAL PAGE ================= */

        #socialPage {
            display: none;
            width: 100%;
        }

        .social-title {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 10px;
        }

        .social-subtitle {
            font-size: 15px;
            color: #374151;
            margin-bottom: 30px;
        }

        .social-links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-link {
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            font-size: 17px;
            font-weight: 600;
            transition: all 0.25s ease;
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.18);
        }

        .social-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
        }

        .facebook {
            background: #1877F2;
        }

        .instagram {
            background: linear-gradient(
                45deg,
                #f09433,
                #e6683c,
                #dc2743,
                #cc2366,
                #bc1888
            );
        }

        .tiktok {
            background: #111111;
        }

        .linkedin {
            background: #0A66C2;
        }

        .back-btn {
            margin-top: 20px;
            width: 100%;
            padding: 15px 20px;
            border-radius: 14px;
            border: none;
            background: rgba(255, 255, 255, 0.85);
            color: #111827;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            background: white;
        }

        /* ================= FOOTER ================= */

        .footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 13px;
            color: #374151;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 480px) {

            .container {
                padding: 35px 18px 25px;
            }

            .logo {
                width: 160px;
                height: 160px;
            }

            .title {
                font-size: 26px;
            }

            .subtitle {
                font-size: 15px;
            }

            .btn,
            .social-link {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ================= HOME PAGE ================= -->

        <div id="homePage">

            <img src="acs.jpg" alt="ACS Student Chapter Logo" class="logo">

            <h1 class="title">
                ACS Student Chapter
            </h1>

            <p class="subtitle">
                Ain Shams University Student Chapter
            </p>

            <div class="buttons">

                <a
                    href="https://tally.so/r/xXqXBG"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn social-btn">
                    Registration Form
                </a>

                <button class="btn social-btn" onclick="showSocialPage()">
                    Social Media
                </button>

            </div>

        </div>


        <!-- ================= SOCIAL MEDIA PAGE ================= -->

        <div id="socialPage">

            <img src="acs.jpg" alt="ACS Student Chapter Logo" class="logo">

            <h2 class="social-title">
                Social Media
            </h2>

            <p class="social-subtitle">
                Follow ACS Ain Shams University Student Chapter
            </p>

            <div class="social-links">

                <a
                    href="https://www.facebook.com/share/1WGXzNVfxr/"
                    target="_blank"
                    class="social-link facebook">
                    Facebook
                </a>

                <a
                    href="https://www.instagram.com/acs672019?igsi=MTZyYjF4eHJ0ZjRpYQ=="
                    target="_blank"
                    class="social-link instagram">
                    Instagram
                </a>

                <a
                    href="https://www.tiktok.com/@acs0775?_r=1&_t=ZS-99SIyQQvjaH"
                    target="_blank"
                    class="social-link tiktok">
                    TikTok
                </a>

                <a
                    href="https://www.linkedin.com/company/acschapter/"
                    target="_blank"
                    class="social-link linkedin">
                    LinkedIn
                </a>

            </div>

            <button class="back-btn" onclick="showHomePage()">
                ← Back
            </button>

        </div>


        <!-- ================= FOOTER ================= -->

        <div class="footer">
            © 2026 ACS Student Chapter
        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function showSocialPage() {
            document.getElementById("homePage").style.display = "none";
            document.getElementById("socialPage").style.display = "block";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        function showHomePage() {
            document.getElementById("socialPage").style.display = "none";
            document.getElementById("homePage").style.display = "block";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

    </script>

</body>
</html>
